#
# meridian-woa: two-system picker for Windows on Arm laptops.
# Each entry hands off to a firmware boot entry that already works on its own
# (firmware_bootnum) instead of chain-loading across ESPs. Meridian-Boot.ps1
# fills in the real Boot#### numbers at install time; on the reference laptop
# they are Boot0001 = Windows Boot Manager and Boot0002 = Limine.

timeout 8
resolution max
default_selection "Windows 11"
scanfor manual
showtools none
scan_limine false
scan_btrfs_snapshots false
network_probe false
network_dhcp false
screensaver 0

menuentry "Windows 11" {
    if_arch aarch64
    firmware_bootnum 0001
    ostype W
}

menuentry "Omarchy" {
    if_arch aarch64
    firmware_bootnum 0002
    ostype L
}
